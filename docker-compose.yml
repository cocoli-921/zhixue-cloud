services:
  mysql:
    image: mysql:8.4
    container_name: zhixue-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: zhixue
      MYSQL_USER: zhixue
      MYSQL_PASSWORD: zhixue_password
    ports:
      - "3307:3306"
    volumes:
      - zhixue_mysql_data:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
volumes:
  zhixue_mysql_data:
