services:
  mysql:
    image: mysql:8.4
    container_name: zhixue-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: zhixue
      MYSQL_USER: zhixue
      MYSQL_PASSWORD: zhixue_password
    ports:
      - "3306:3306"
    volumes:
      - zhixue_mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password
volumes:
  zhixue_mysql_data:
